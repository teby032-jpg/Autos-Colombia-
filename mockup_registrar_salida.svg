<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172b45}
      .muted{fill:#75849a}.small{font-size:13px}.body{font-size:15px}.title{font-size:27px;font-weight:700}.section{font-size:18px;font-weight:700}.label{font-size:12px;font-weight:600;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1440" height="960" fill="#f4f7fa"/>
