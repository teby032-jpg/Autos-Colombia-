  <rect x="248" width="1192" height="76" fill="#ffffff"/><line x1="248" y1="75.5" x2="1440" y2="75.5" stroke="#e7ecf1"/>
  <text x="282" y="47" class="body muted">Sistema de parqueadero</text><circle cx="1363" cy="38" r="18" fill="#f0f4f7"/><text x="1363" y="43" text-anchor="middle" font-size="15">?</text>
  <circle cx="1407" cy="38" r="18" fill="#d9f4ea"/><text x="1407" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#16845b">CP</text>
  <text x="282" y="133" class="title">Registrar salida</text>
  <text x="282" y="161" class="body muted">Busca la estancia activa, revisa el resumen y finaliza el registro.</text>
