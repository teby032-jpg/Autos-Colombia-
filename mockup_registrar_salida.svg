  <text x="312" y="716" class="small muted">Tarifa por hora</text><text x="604" y="716" class="small" font-weight="600">$4.000 COP</text>
  <text x="312" y="760" class="small muted">La hora de salida se guardará al confirmar.</text>
  <rect x="997" y="383" width="399" height="408" rx="14" fill="#ffffff" stroke="#e5ebf0"/>
